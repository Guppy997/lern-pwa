services:
  backend:
    build: ./backend
    container_name: lern-pwa-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  frontend:
    build: ./frontend
    container_name: lern-pwa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 16M

  # Eigener Tailscale-Knoten nur für diese App, siehe fitness-pwa/docker-compose.yml
  # für die ausführliche Begründung (Android-WebAPK-Host-statt-Port-Kollision).
  ts-lern:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    container_name: lern-pwa-ts
    hostname: lern-pwa
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=lern-pwa
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:pwa-sidecar
    volumes:
      - ts-lern-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  ts-lern-state:
