services:
  backend:
    build: ./backend
    container_name: lern-pwa-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  frontend:
    build: ./frontend
    container_name: lern-pwa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 16M

  # Optional: eigener Tailscale-Knoten nur für diese App. Sie bekommt so einen
  # eigenen Hostnamen im Tailnet (lern-pwa.<tailnet>.ts.net) samt HTTPS-Zertifikat,
  # statt sich Hostname + Port mit anderen Web-Apps auf demselben Server zu teilen.
  # Grund: Android-WebAPKs ordnen sich teils nur über den Hostnamen (ohne Port)
  # einer Seite zu — mehrere PWAs auf demselben Host mit verschiedenen Ports
  # kollidieren dadurch beim Installieren ("In <andere App> öffnen").
  # TS_USERSPACE=true: reines Userspace-Networking, kein /dev/net/tun und kein
  # NET_ADMIN nötig (der Container nimmt nur Verbindungen an, routet nichts).
  # Ohne TS_AUTHKEY in .env einfach weglassen: docker compose up -d backend frontend
  ts-lern:
    image: tailscale/tailscale@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    container_name: lern-pwa-ts
    hostname: lern-pwa
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=lern-pwa
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:pwa-sidecar
    volumes:
      - ts-lern-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  ts-lern-state:
