name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      # Deutsche Zeitzone, damit Fehler bei Tagesgrenzen und Zeitumstellung auffallen
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend installieren
        working-directory: backend
        run: npm ci
      - name: Backend testen
        working-directory: backend
        run: npm test

      - name: Frontend installieren
        working-directory: frontend
        run: npm ci
      - name: Frontend bauen
        working-directory: frontend
        run: npm run build
