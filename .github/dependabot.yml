version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    # Große Versionssprünge (z. B. React 19, Express 5) brauchen meist Code-
    # Anpassungen und werden bewusst von Hand gemacht; automatisch nur Minor/Patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      kleine-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
